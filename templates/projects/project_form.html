{% extends "base.html" %}
{% block title %}{{ "Editar" if project else "Nuevo" }} proyecto{% endblock %}
{% block content %}
<h1>{{ "Editar" if project else "Nuevo" }} proyecto</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if not project %}<label>Código <input name="code" required maxlength="40"></label>{% endif %}
  <label>Nombre <input name="name" required maxlength="160" value="{{ project.name if project else '' }}"></label>
  <label>Descripción <textarea name="description">{{ project.description if project else '' }}</textarea></label>
  <label>Objetivos <textarea name="objectives">{{ project.objectives if project else '' }}</textarea></label>
  <label>Patrocinador <input name="sponsor" maxlength="160" value="{{ project.sponsor if project else '' }}"></label>
  <label>Presupuesto <input name="authorized_budget" type="number" min="0" step="0.01" value="{{ project.authorized_budget if project else '0' }}"></label>
  <label>Inicio planificado <input name="planned_start" type="date" value="{{ project.planned_start if project and project.planned_start else '' }}"></label>
  <label>Término planificado <input name="planned_end" type="date" value="{{ project.planned_end if project and project.planned_end else '' }}"></label>
  {% if project %}
  <label>Estado <select name="status">
    {% for status in ("planificado", "en_ejecucion", "suspendido", "terminado") %}
    <option value="{{ status }}" {% if project.status == status %}selected{% endif %}>{{ status }}</option>
    {% endfor %}
  </select></label>
  {% endif %}
  <button type="submit">Guardar</button>
</form>
{% endblock %}
